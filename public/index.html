<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频原始链接解析工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2a2a3a;
      --accent: #7c6af7;
      --accent-glow: rgba(124, 106, 247, 0.25);
      --text: #e8e8f0;
      --text-muted: #6b6b80;
      --green: #34d399;
      --red: #f87171;
      --tag-bg: #1e1e2e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }

    .container { width: 100%; max-width: 720px; }

    header { text-align: center; margin-bottom: 48px; }
    header h1 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa, #7c6af7, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p { margin-top: 8px; color: var(--text-muted); font-size: 14px; }

    .badge-row { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .badge {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px;
      font-size: 12px; color: var(--text-muted);
    }

    /* Input area */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .history-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 24px;
    }
    .history-card.visible { display: block; }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .history-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .history-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
    }
    .history-list { display: grid; gap: 8px; }
    .history-item {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      overflow: hidden;
    }
    .history-item-body {
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }
    .history-item img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface);
      flex-shrink: 0;
    }
    .history-item-title {
      font-size: 12px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item-meta {
      margin-top: 3px;
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-pager {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }
    .history-pager.visible { display: flex; }
    .history-page-info {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .history-page-actions {
      display: flex;
      gap: 8px;
    }
    .history-page-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
    }
    .history-page-btn:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }

    textarea {
      width: 100%; height: 90px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 12px 14px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    textarea::placeholder { color: var(--text-muted); }

    .btn-row { display: flex; gap: 10px; margin-top: 14px; }

    button {
      cursor: pointer; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      padding: 10px 22px; transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent); color: #fff; flex: 1;
    }
    .btn-primary:hover { background: #6c5ce7; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 16px;
    }
    .btn-clear:hover { border-color: var(--text-muted); color: var(--text); }

    /* Loading */
    .loading {
      display: none; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      margin-bottom: 20px; font-size: 14px; color: var(--text-muted);
    }
    .loading.visible { display: flex; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 12px; padding: 16px 20px;
      margin-bottom: 20px; font-size: 14px; color: var(--red);
    }
    .error-box.visible { display: block; }

    /* Result card */
    .result-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .result-card.visible { display: block; }

    .result-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
    }
    .thumb {
      width: 72px; height: 72px; border-radius: 10px;
      object-fit: cover; background: var(--bg); flex-shrink: 0;
    }
    .meta { flex: 1; overflow: hidden; }
    .meta-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .meta-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
    .meta-tag {
      background: var(--tag-bg); border: 1px solid var(--border);
      border-radius: 4px; padding: 2px 7px; font-size: 11px;
    }

    .url-section { padding: 20px 24px; }
    .section-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 14px;
    }

    .url-group { margin-bottom: 20px; }
    .url-group-label {
      font-size: 12px; color: var(--accent); font-weight: 600;
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

    .url-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .url-text {
      flex: 1; font-size: 12px; color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .url-text:hover { color: var(--text); }

    .url-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .url-actions button {
      font-size: 11px; font-weight: 500;
      padding: 5px 10px; border-radius: 6px;
    }
    .btn-copy {
      background: rgba(124, 106, 247, 0.15);
      border: 1px solid rgba(124, 106, 247, 0.3);
      color: var(--accent);
    }
    .btn-copy:hover { background: rgba(124, 106, 247, 0.25); }
    .btn-copy.copied { background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3); color: var(--green); }

    .btn-open {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: var(--green);
    }
    .btn-open:hover { background: rgba(52, 211, 153, 0.2); }

    .btn-download {
      background: rgba(96, 165, 250, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #60a5fa;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-download:hover { background: rgba(96, 165, 250, 0.28); }
    .btn-download.downloading {
      opacity: 0.6; cursor: not-allowed;
      background: rgba(96, 165, 250, 0.08);
    }
    .btn-download svg { width: 11px; height: 11px; flex-shrink: 0; }

    .size-chip {
      font-size: 11px;
      color: var(--green);
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.22);
      padding: 4px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .diagnostics {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .hint {
      font-size: 12px; color: var(--text-muted);
      background: rgba(124, 106, 247, 0.06);
      border: 1px solid rgba(124, 106, 247, 0.15);
      border-radius: 8px; padding: 12px 14px;
      margin-top: 4px; line-height: 1.6;
    }

    footer {
      margin-top: 56px; text-align: center;
      font-size: 12px; color: var(--text-muted); line-height: 2;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 12px 96px;
        align-items: stretch;
      }
      .container { max-width: none; }
      header {
        text-align: left;
        margin-bottom: 22px;
      }
      header h1 { font-size: 25px; }
      .badge-row { justify-content: flex-start; }
      .input-card {
        position: sticky;
        top: 10px;
        z-index: 10;
        padding: 16px;
        border-radius: 18px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.26);
      }
      textarea {
        height: 116px;
        font-size: 16px;
      }
      .btn-row button {
        min-height: 48px;
        font-size: 15px;
      }
      .result-card,
      .history-card {
        border-radius: 18px;
      }
      .result-header {
        padding: 16px;
        align-items: flex-start;
      }
      .thumb {
        width: 64px;
        height: 64px;
      }
      .meta-title {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .url-section { padding: 16px; }
      .url-item {
        display: block;
        padding: 14px;
        border-radius: 14px;
      }
      .url-text {
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 12px;
      }
      .url-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
      }
      .url-actions .size-chip {
        flex: 0 0 auto;
        max-width: 92px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .url-actions button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 42px;
        font-size: 13px;
        justify-content: center;
      }
      footer { margin-top: 30px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>视频原始链接解析</h1>
      <p>从分享链接提取无水印的原始 CDN 播放地址</p>
      <div class="badge-row">
        <span class="badge">抖音</span>
        <span class="badge">即梦</span>
        <span class="badge">通用</span>
        <span class="badge">仅用于自有内容</span>
      </div>
    </header>

    <div class="input-card">
      <label>粘贴分享链接或分享文字（支持完整文字，会自动提取链接）</label>
      <textarea id="urlInput" placeholder="例如：https://v.douyin.com/xxxxxxx/&#10;或直接粘贴抖音、即梦分享文案&#10;启用 yt-dlp 后可粘贴 B 站 / YouTube / X 等公开链接"></textarea>
      <div class="btn-row">
        <button class="btn-primary" id="parseBtn" onclick="parse()">解析</button>
        <button class="btn-clear" onclick="clearInput()">清除</button>
      </div>
    </div>

    <div class="history-card" id="historyCard">
      <div class="history-head">
        <div class="history-title">最近解析</div>
        <button class="history-clear" onclick="clearHistory()">清空</button>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="history-pager" id="historyPager"></div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span id="loadingText">正在解析链接...</span>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result-card" id="resultCard">
      <div class="result-header">
        <img class="thumb" id="thumbImg" src="" alt="封面">
        <div class="meta">
          <div class="meta-title" id="videoTitle"></div>
          <div class="meta-sub">
            <span class="meta-tag" id="platformTag"></span>
            <span id="authorTag"></span>
            <span id="sizeTag"></span>
            <span id="durationTag"></span>
          </div>
        </div>
      </div>

      <div class="url-section">
        <div class="section-title">原始视频地址</div>
        <div id="urlGroups"></div>
        <div class="hint">
          💡 <strong>play_addr 流媒体地址</strong>是平台内部播放地址，无水印。<br>
          这些 CDN URL 有时效性（通常数小时内有效），请及时保存或下载。<br>
          可用 <code>curl -L -o video.mp4 "链接"</code> 直接下载。
        </div>
      </div>
    </div>

    <footer>
      本工具仅供解析你自己创作的视频，请勿用于下载他人内容<br>
      CDN 地址由平台 API 返回，本工具不存储任何数据
    </footer>
  </div>

  <script>
    const HISTORY_KEY = 'video-parser-history-v1';
    const HISTORY_PAGE_SIZE = 5;
    let lastResult = null;
    let currentHistoryPage = 1;

    async function parse() {
      const input = document.getElementById('urlInput').value.trim();
      if (!input) return;

      setLoading(true);
      hideAll();

      try {
        const res = await fetch('/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input }),
        });
        const data = await res.json();

        if (!data.success) {
          showError(data);
        } else {
          showResult(data);
          saveHistory(data, input);
        }
      } catch (e) {
        showError({ error: '网络请求失败: ' + e.message, diagnostics: { code: 'NETWORK_ERROR' } });
      } finally {
        setLoading(false);
      }
    }

    function clearInput() {
      document.getElementById('urlInput').value = '';
      lastResult = null;
      setLoading(false);
      hideAll();
      document.getElementById('urlGroups').innerHTML = '';
      document.getElementById('videoTitle').textContent = '';
      document.getElementById('platformTag').textContent = '';
      document.getElementById('authorTag').textContent = '';
      document.getElementById('sizeTag').textContent = '';
      document.getElementById('durationTag').textContent = '';
      const thumb = document.getElementById('thumbImg');
      thumb.removeAttribute('src');
      thumb.style.display = '';
    }

    function setLoading(on) {
      document.getElementById('loading').classList.toggle('visible', on);
      document.getElementById('parseBtn').disabled = on;
      if (on) {
        const steps = ['正在解析链接...', '跟踪重定向中...', '请求平台 API...', '提取 CDN 地址...'];
        let i = 0;
        window._loadTimer = setInterval(() => {
          document.getElementById('loadingText').textContent = steps[Math.min(i++, steps.length - 1)];
        }, 1200);
      } else {
        clearInterval(window._loadTimer);
      }
    }

    function hideAll() {
      document.getElementById('errorBox').classList.remove('visible');
      document.getElementById('resultCard').classList.remove('visible');
    }

    function showError(payload) {
      const el = document.getElementById('errorBox');
      const msg = typeof payload === 'string' ? payload : payload.error;
      const diagnostics = typeof payload === 'object' ? payload.diagnostics : null;
      el.innerHTML = `解析失败：${escapeHtml(msg || '未知错误')}`;
      if (diagnostics?.code) {
        el.innerHTML += `<div class="diagnostics">诊断码：${escapeHtml(diagnostics.code)}</div>`;
      }
      el.classList.add('visible');
    }

    function showResult(data) {
      lastResult = data;
      // 封面
      const thumb = document.getElementById('thumbImg');
      thumb.style.display = '';
      if (data.cover) {
        thumb.src = data.cover;
        thumb.onerror = () => { thumb.style.display = 'none'; };
      } else {
        thumb.style.display = 'none';
      }

      document.getElementById('videoTitle').textContent = data.title || '(无标题)';
      document.getElementById('platformTag').textContent = platformLabel(data.platform);

      const author = document.getElementById('authorTag');
      author.textContent = data.author ? '@' + data.author : '';

      const sizeTag = document.getElementById('sizeTag');
      sizeTag.textContent = '';
      if (data.width && data.height) {
        sizeTag.textContent = `${data.width}×${data.height}`;
      }

      const durTag = document.getElementById('durationTag');
      durTag.textContent = '';
      if (data.duration) {
        const s = Math.round(data.duration / 1000);
        durTag.textContent = `${s}s`;
      }

      // URL groups
      const container = document.getElementById('urlGroups');
      container.innerHTML = '';

      const videoUrls = data.videoUrls || {};
      const fileInfoMap = new Map((data.fileInfos || []).map(item => [item.url, item]));
      let anyUrl = false;

      const videoTitle = data.title || 'douyin_video';

      for (const [groupName, urls] of Object.entries(videoUrls)) {
        if (!urls || urls.length === 0) continue;
        anyUrl = true;

        // 判断是否显示下载按钮：抖音/即梦走代理，yt-dlp 通用直链走浏览器直连
        const isNoWatermark = groupName.includes('无水印') || groupName.includes('水印版') || groupName.includes('下载直链');

        const group = document.createElement('div');
        group.className = 'url-group';

        const label = document.createElement('div');
        label.className = 'url-group-label';
        label.innerHTML = `<span class="dot"></span>${groupName}`;
        group.appendChild(label);

        urls.forEach((url) => {
          const item = document.createElement('div');
          item.className = 'url-item';

          const text = document.createElement('div');
          text.className = 'url-text';
          text.textContent = url;
          text.title = url;
          text.onclick = () => copyUrl(url, copyBtn);

          const actions = document.createElement('div');
          actions.className = 'url-actions';

          const copyBtn = document.createElement('button');
          copyBtn.className = 'btn-copy';
          copyBtn.textContent = '复制';
          copyBtn.onclick = () => copyUrl(url, copyBtn);

          const fileInfo = fileInfoMap.get(url);
          if (fileInfo?.sizeText) {
            const chip = document.createElement('span');
            chip.className = 'size-chip';
            chip.textContent = fileInfo.sizeText;
            actions.appendChild(chip);
          }

          // 无水印组显示下载/保存按钮
          if (isNoWatermark) {
            const dlBtn = document.createElement('button');
            dlBtn.className = 'btn-download';
            dlBtn.innerHTML = downloadButtonHTML('下载');
            dlBtn.onclick = () => {
              if (data.platform === 'ytdlp') {
                directDownload(url, dlBtn);
              } else {
                downloadVideo(url, videoTitle, dlBtn);
              }
            };
            actions.appendChild(copyBtn);
            actions.appendChild(dlBtn);
          } else {
            const openBtn = document.createElement('button');
            openBtn.className = 'btn-open';
            openBtn.textContent = '打开';
            openBtn.onclick = () => window.open(url, '_blank');
            actions.appendChild(copyBtn);
            actions.appendChild(openBtn);
          }

          item.appendChild(text);
          item.appendChild(actions);
          group.appendChild(item);
        });

        container.appendChild(group);
      }

      if (!anyUrl) {
        container.innerHTML = '<div style="color:var(--red);font-size:13px">未获取到有效视频地址，平台 API 可能已变更</div>';
      }

      document.getElementById('resultCard').classList.add('visible');
    }

    async function copyUrl(url, btn) {
      try {
        await navigator.clipboard.writeText(url);
        const orig = btn.textContent;
        btn.textContent = '已复制!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
      } catch (_) {
        prompt('手动复制此链接：', url);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      } catch (_) {
        return [];
      }
    }

    function saveHistory(data, input) {
      const primaryUrl = firstPrimaryUrl(data.videoUrls || {});
      if (!primaryUrl) return;
      const item = {
        id: data.videoId || data.awemeId || primaryUrl,
        input,
        platform: data.platform,
        title: data.title || '未命名视频',
        cover: data.cover || '',
        savedAt: Date.now(),
        primaryUrl,
        result: data,
      };
      const next = [item, ...loadHistory().filter(old => old.id !== item.id)].slice(0, 12);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      currentHistoryPage = 1;
      renderHistory();
    }

    function firstPrimaryUrl(videoUrls) {
      for (const [name, urls] of Object.entries(videoUrls)) {
        if (name.includes('无水印') && urls?.[0]) return urls[0];
      }
      return '';
    }

    function renderHistory() {
      const history = loadHistory();
      const card = document.getElementById('historyCard');
      const list = document.getElementById('historyList');
      const pager = document.getElementById('historyPager');
      if (!history.length) {
        card.classList.remove('visible');
        list.innerHTML = '';
        pager.innerHTML = '';
        pager.classList.remove('visible');
        return;
      }

      const pageCount = Math.max(1, Math.ceil(history.length / HISTORY_PAGE_SIZE));
      currentHistoryPage = Math.min(Math.max(currentHistoryPage, 1), pageCount);
      const start = (currentHistoryPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = history.slice(start, start + HISTORY_PAGE_SIZE);

      list.innerHTML = pageItems.map((item, index) => `
        <button class="history-item" onclick="restoreHistory(${start + index})">
          ${item.cover ? `<img src="${escapeAttr(item.cover)}" alt="">` : '<img alt="">'}
          <div class="history-item-body">
            <div class="history-item-title">${escapeHtml(item.title)}</div>
            <div class="history-item-meta">${platformLabel(item.platform)} · ${new Date(item.savedAt).toLocaleString()}</div>
          </div>
        </button>
      `).join('');

      if (pageCount > 1) {
        pager.innerHTML = `
          <div class="history-page-info">${currentHistoryPage} / ${pageCount} · 共 ${history.length} 条</div>
          <div class="history-page-actions">
            <button class="history-page-btn" onclick="changeHistoryPage(-1)" ${currentHistoryPage <= 1 ? 'disabled' : ''}>上一页</button>
            <button class="history-page-btn" onclick="changeHistoryPage(1)" ${currentHistoryPage >= pageCount ? 'disabled' : ''}>下一页</button>
          </div>
        `;
        pager.classList.add('visible');
      } else {
        pager.innerHTML = '';
        pager.classList.remove('visible');
      }
      card.classList.add('visible');
    }

    function changeHistoryPage(delta) {
      currentHistoryPage += delta;
      renderHistory();
    }

    function restoreHistory(index) {
      const item = loadHistory()[index];
      if (!item?.result) return;
      document.getElementById('urlInput').value = item.input || '';
      hideAll();
      showResult(item.result);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function platformLabel(platform) {
      if (platform === 'douyin') return '抖音';
      if (platform === 'jimeng') return '即梦';
      if (platform === 'ytdlp') return '通用';
      return platform || '未知平台';
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      currentHistoryPage = 1;
      renderHistory();
    }

    function downloadButtonHTML(text) {
      return `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 12l-4-4h2.5V4h3v4H12L8 12z"/><rect x="3" y="13" width="10" height="1.5" rx="0.75"/></svg>${text}`;
    }

    function downloadVideo(url, title, btn) {
      if (btn.classList.contains('downloading')) return;

      // 通过后端代理下载，避免跨域和 Referer 问题
      const proxyUrl = `/api/download?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;
      const a = document.createElement('a');
      a.href = proxyUrl;
      a.download = ''; // 文件名由后端 Content-Disposition 决定
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // 按钮状态反馈
      btn.classList.add('downloading');
      btn.innerHTML = downloadButtonHTML('下载中…');
      setTimeout(() => {
        btn.classList.remove('downloading');
        btn.innerHTML = downloadButtonHTML('下载');
      }, 4000);
    }

    function directDownload(url, btn) {
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      const original = btn.innerHTML;
      btn.innerHTML = downloadButtonHTML('已打开');
      setTimeout(() => {
        btn.innerHTML = original;
      }, 1800);
    }

    // Enter 快捷键提交
    document.addEventListener('DOMContentLoaded', () => {
      renderHistory();
      document.getElementById('urlInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) parse();
      });
    });
  </script>
</body>
</html>
